name: Docs

on:
  push:
    branches:
      - master
      - 'v*.*.x'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - master
      - 'v*.*.x'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & (optionally) deploy documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Install Python dependencies
        run: |
          pip install -r docs/requirements.txt

      - name: Build documentation
        run: |
          make -C docs html SPHINXOPTS="-W --keep-going"

      - name: Compute deploy destination
        id: dest
        run: |
          ref="${GITHUB_REF}"
          if [[ "$ref" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "destination=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "also_stable=true" >> "$GITHUB_OUTPUT"
            echo "also_dev=false" >> "$GITHUB_OUTPUT"
          elif [[ "$ref" =~ ^refs/heads/v[0-9]+\.[0-9]+\.x$ ]]; then
            echo "destination=${GITHUB_REF_NAME}-dev" >> "$GITHUB_OUTPUT"
            echo "also_stable=false" >> "$GITHUB_OUTPUT"
            # dev/ tracks the highest-numbered v*.*.x branch, so it only moves
            # when the branch being built is that one.
            latest=$(git ls-remote --heads origin 'refs/heads/v*.*.x' \
                       | sed 's|.*refs/heads/||' | sort -V | tail -n1)
            echo "highest release branch: ${latest:-<none>} (building ${GITHUB_REF_NAME})"
            if [ "$latest" = "$GITHUB_REF_NAME" ]; then
              echo "also_dev=true" >> "$GITHUB_OUTPUT"
            else
              echo "also_dev=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "destination=" >> "$GITHUB_OUTPUT"
            echo "also_stable=false" >> "$GITHUB_OUTPUT"
            echo "also_dev=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to ${{ steps.dest.outputs.destination }}/
        if: github.event_name != 'pull_request' && steps.dest.outputs.destination != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
          destination_dir: ${{ steps.dest.outputs.destination }}
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          commit_message: 'docs: publish ${{ steps.dest.outputs.destination }} (${{ github.sha }})'

      - name: Refresh stable/
        if: steps.dest.outputs.also_stable == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
          destination_dir: stable
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          commit_message: 'docs: refresh stable/ from ${{ github.ref_name }}'

      # dev/ mirrors the HEAD of the highest v*.*.x branch.
      - name: Refresh dev/
        if: github.event_name != 'pull_request' && steps.dest.outputs.also_dev == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
          destination_dir: dev
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          commit_message: 'docs: refresh dev/ from ${{ github.ref_name }}'

      # Root landing page: bare `https://<org>.github.io/nson/` redirects to stable/.
      - name: Prepare root redirect
        if: steps.dest.outputs.also_stable == 'true'
        run: |
          mkdir -p root-redirect
          cat > root-redirect/index.html <<'EOF'
          <!DOCTYPE html>
          <meta charset="utf-8">
          <title>nson documentation</title>
          <meta http-equiv="refresh" content="0; url=stable/">
          <link rel="canonical" href="stable/">
          <p>Redirecting to <a href="stable/">stable/</a>&hellip;</p>
          EOF

      - name: Publish root redirect
        if: steps.dest.outputs.also_stable == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./root-redirect
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          commit_message: 'docs: refresh root redirect'
