name: Docs

on:
  push:
    branches:
      - master
      - 'v*.*.x'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - master
      - 'v*.*.x'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & (optionally) deploy documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Install Python dependencies
        run: |
          pip install -r docs/requirements.txt

      - name: Build documentation
        run: |
          make -C docs html SPHINXOPTS="-W --keep-going"

      - name: Compute deploy destination
        id: dest
        run: |
          ref="${GITHUB_REF}"
          if [[ "$ref" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "destination=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "also_stable=true" >> "$GITHUB_OUTPUT"
            echo "also_dev=false" >> "$GITHUB_OUTPUT"
          elif [[ "$ref" =~ ^refs/heads/v[0-9]+\.[0-9]+\.x$ ]]; then
            echo "destination=${GITHUB_REF_NAME}-dev" >> "$GITHUB_OUTPUT"
            echo "also_stable=false" >> "$GITHUB_OUTPUT"
            # dev/ tracks the highest-numbered v*.*.x branch, so it only moves
            # when the branch being built is that one.
            latest=$(git ls-remote --heads origin 'refs/heads/v*.*.x' \
                       | sed 's|.*refs/heads/||' | sort -V | tail -n1)
            echo "highest release branch: ${latest:-<none>} (building ${GITHUB_REF_NAME})"
            if [ "$latest" = "$GITHUB_REF_NAME" ]; then
              echo "also_dev=true" >> "$GITHUB_OUTPUT"
            else
              echo "also_dev=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "destination=" >> "$GITHUB_OUTPUT"
            echo "also_stable=false" >> "$GITHUB_OUTPUT"
            echo "also_dev=false" >> "$GITHUB_OUTPUT"
          fi

      # Everything this run publishes is staged into one directory and pushed as
      # a single commit. The previous version ran one peaceiris step per
      # destination, so a push rejected part-way through left gh-pages
      # half-updated (v0.1.0/ published, stable/ and the root redirect missing).
      - name: Assemble gh-pages payload
        id: payload
        if: github.event_name != 'pull_request' && steps.dest.outputs.destination != ''
        run: |
          html=docs/_build/html
          out=gh-pages-payload
          published=""

          publish_into() {
            mkdir -p "$out/$1"
            cp -R "$html/." "$out/$1/"
            published="${published:+$published, }$1/"
          }

          publish_into '${{ steps.dest.outputs.destination }}'

          if [ '${{ steps.dest.outputs.also_stable }}' = true ]; then
            publish_into stable
            # Root landing page: bare https://<org>.github.io/nson/ -> stable/.
            cat > "$out/index.html" <<'EOF'
          <!DOCTYPE html>
          <meta charset="utf-8">
          <title>nson documentation</title>
          <meta http-equiv="refresh" content="0; url=stable/">
          <link rel="canonical" href="stable/">
          <p>Redirecting to <a href="stable/">stable/</a>&hellip;</p>
          EOF
            published="$published, index.html"
          fi

          # dev/ mirrors the HEAD of the highest v*.*.x branch.
          if [ '${{ steps.dest.outputs.also_dev }}' = true ]; then
            publish_into dev
          fi

          echo "publishing: $published"
          echo "published=$published" >> "$GITHUB_OUTPUT"

      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request' && steps.dest.outputs.destination != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-payload
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          commit_message: 'docs: publish ${{ steps.payload.outputs.published }} from ${{ github.ref_name }}'
